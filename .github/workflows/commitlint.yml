name: Commitlint

on:
  workflow_call:
    inputs:
      node-version-file:
        description: "Path to the node version file (e.g. .nvmrc)"
        type: string
        default: ".nvmrc"
      config-file:
        description: "Optional path to commitlint config in caller repo; empty uses shared default from jorkab/release-automation"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - uses: actions/checkout@v7
        with:
          repository: jorkab/release-automation
          path: .release-automation

      - run: npm ci --prefix .release-automation

      - run: |
          CONFIG_FILE="${{ inputs.config-file }}"
          if [ -z "$CONFIG_FILE" ]; then
            CONFIG_FILE=".release-automation/commit-lint.config.js"
          fi

          FROM_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          TO_SHA="${{ github.event.pull_request.head.sha || github.sha }}"

          if [ -z "$FROM_SHA" ] || [ "$FROM_SHA" = "0000000000000000000000000000000000000000" ]; then
            FROM_SHA=$(git rev-list --max-count=2 HEAD | tail -n 1)
          fi

          if [ -z "$FROM_SHA" ] || [ "$FROM_SHA" = "$TO_SHA" ]; then
            if git rev-parse --verify "${TO_SHA}^" >/dev/null 2>&1; then
              FROM_SHA="${TO_SHA}^"
            else
              FROM_SHA=""
            fi
          fi

          if [ -n "$FROM_SHA" ]; then
            npx --prefix .release-automation commitlint --config "$CONFIG_FILE" --from "$FROM_SHA" --to "$TO_SHA" --verbose
          else
            npx --prefix .release-automation commitlint --config "$CONFIG_FILE" --last --verbose
          fi
        env:
          ACTION_CONFIG: "commitlint"
